name: iOS Build

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned generic iOS build
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Show build environment
        run: |
          sw_vers
          xcode-select --print-path
          xcodebuild -version

      - name: List Xcode schemes
        run: |
          set -o pipefail
          xcodebuild -list -json -project Moonlight.xcodeproj | tee "$RUNNER_TEMP/xcode-list.json"

      - name: Select iOS scheme
        id: scheme
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import sys

          path = os.path.join(os.environ["RUNNER_TEMP"], "xcode-list.json")
          with open(path, "r", encoding="utf-8") as handle:
              data = json.load(handle)

          project = data.get("project", {})
          schemes = project.get("schemes", [])
          if not schemes:
              print("No schemes were reported by xcodebuild -list.", file=sys.stderr)
              sys.exit(1)

          preferred = next((name for name in schemes if name == "Moonlight"), None)
          if preferred is None:
              candidates = [name for name in schemes if "tv" not in name.lower()]
              if len(candidates) != 1:
                  print(f"Unable to select one iOS scheme from: {schemes}", file=sys.stderr)
                  sys.exit(1)
              preferred = candidates[0]

          print(f"Selected scheme: {preferred}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"name={preferred}\n")
          PY

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project Moonlight.xcodeproj \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MoonlightDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Select iOS simulator
        id: simulator
        shell: bash
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 <<'PY'
          import json
          import os
          import sys

          path = os.path.join(os.environ["RUNNER_TEMP"], "simulators.json")
          with open(path, "r", encoding="utf-8") as handle:
              data = json.load(handle)

          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "SimRuntime.iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPad"):
                      candidates.append(device)

          if not candidates:
              print("No available iPad Simulator was found.", file=sys.stderr)
              sys.exit(1)

          selected = next(
              (device for device in candidates if "iPad Pro 13-inch" in device["name"]),
              candidates[0],
          )
          print(f"Selected simulator: {selected['name']} ({selected['udid']})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"udid={selected['udid']}\n")
          PY

      - name: Run MOBA unit tests
        run: |
          set -o pipefail
          xcodebuild \
            test \
            -project Moonlight.xcodeproj \
            -scheme MoonlightMobaTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/MoonlightMobaTestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
